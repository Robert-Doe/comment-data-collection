<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Sign In — UGC XSS Research Tool</title>
  <script src="./config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left,  rgba(200,221,255,.75), transparent 34%),
        radial-gradient(circle at top right, rgba(230,239,255,.85), transparent 28%),
        linear-gradient(180deg, #f7f9fe 0%, #eef3fb 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111827;
    }
    .card {
      background: rgba(255,255,255,.97);
      border: 1px solid rgba(17,24,39,.1);
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0,0,0,.08);
      padding: 2.5rem 2.75rem;
      width: 100%;
      max-width: 390px;
    }
    .icon { font-size: 2rem; margin-bottom: .8rem; }
    .logo { font-size: 1.35rem; font-weight: 700; letter-spacing: -.4px; color: #1e3a5f; margin-bottom: .35rem; }
    .subtitle { font-size: .82rem; color: #6b7280; margin-bottom: 1.8rem; }
    label { display: block; font-size: .8rem; font-weight: 600; color: #374151; margin-bottom: .4rem; }
    input {
      width: 100%; padding: .65rem .85rem;
      border: 1px solid rgba(17,24,39,.18); border-radius: 8px;
      font-size: .93rem; font-family: inherit; background: #fafcff; color: #111827;
      outline: none; transition: border-color .15s; margin-bottom: 1rem;
    }
    input:focus { border-color: #3b6fd4; box-shadow: 0 0 0 3px rgba(59,111,212,.12); }
    button {
      width: 100%; padding: .7rem; background: #1e3a5f; color: #fff;
      border: none; border-radius: 8px; font-size: .93rem; font-weight: 600;
      font-family: inherit; cursor: pointer; transition: background .15s;
    }
    button:hover  { background: #2c5282; }
    button:active { background: #1a3352; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .error {
      margin-top: .9rem; font-size: .81rem; color: #b91c1c;
      background: #fef2f2; border: 1px solid #fecaca;
      border-radius: 6px; padding: .5rem .75rem; display: none;
    }
    .error.on { display: block; }
    .guest-notice {
      margin-top: 1rem; font-size: .78rem; text-align: center; color: #9ca3af;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="icon">🔒</div>
  <div class="logo">UGC XSS Research Tool</div>
  <div class="subtitle" id="subtitle">Sign in to access the research dashboard.</div>

  <form id="login-form">
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="email" placeholder="you@example.com">
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password">
    <button type="submit" id="btn">Sign In</button>
    <div class="error" id="err"></div>
  </form>
  <div class="guest-notice" id="guest-notice" style="display:none">
    Signing in with a guest link…
  </div>
</div>

<script>
(function () {
  var TOKEN_KEY = 'ugc_auth_token';
  var ROLE_KEY  = 'ugc_auth_role';
  var cfg       = window.__APP_CONFIG__ || {};
  var apiBase   = (cfg.apiBaseUrl || '').replace(/\/+$/, '');
  var params    = new URLSearchParams(window.location.search);

  function storeAndRedirect(token, role) {
    try { localStorage.setItem(TOKEN_KEY, token); localStorage.setItem(ROLE_KEY, role || ''); } catch (_) {}
    var next = params.get('next');
    if (next && next.startsWith(window.location.origin)) {
      window.location.replace(next);
      return;
    }
    var landing = role === 'supervisor' ? './supervisor-dashboard.html' : './index.html';
    window.location.replace(landing);
  }

  function showError(msg) {
    var err = document.getElementById('err');
    err.textContent = msg; err.classList.add('on');
    var btn = document.getElementById('btn');
    btn.disabled = false; btn.textContent = 'Sign In';
    document.getElementById('pw').select();
  }

  // If already logged in, skip to dashboard — but honour ?next= if present
  try {
    if (localStorage.getItem(TOKEN_KEY)) {
      var nextParam = params.get('next');
      var safeNext  = nextParam && nextParam.startsWith(window.location.origin) ? nextParam : './index.html';
      window.location.replace(safeNext);
    }
  } catch (_) {}

  // ── Check if first-time setup is needed ─────────────────────────────────
  fetch(apiBase + '/api/auth/setup-status')
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.setup_needed) window.location.replace('./setup.html');
    })
    .catch(function () {});

  // ── Handle guest token in URL (?token=xxx) ───────────────────────────────
  var guestToken = params.get('token');
  if (guestToken) {
    document.getElementById('login-form').style.display = 'none';
    document.getElementById('guest-notice').style.display = 'block';
    fetch(apiBase + '/api/auth/guest-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: guestToken }),
    })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
    .then(function (result) {
      if (result.ok && result.data.token) {
        storeAndRedirect(result.data.token, result.data.role);
      } else {
        document.getElementById('login-form').style.display = 'block';
        document.getElementById('guest-notice').style.display = 'none';
        document.getElementById('subtitle').textContent = 'This guest link has expired or is invalid. Sign in with your account instead.';
        document.getElementById('err').textContent = result.data.error || 'Guest link expired.';
        document.getElementById('err').classList.add('on');
      }
    })
    .catch(function () {
      document.getElementById('login-form').style.display = 'block';
      document.getElementById('guest-notice').style.display = 'none';
      showError('Network error while validating guest link.');
    });
    return;
  }

  // ── Standard email + password login ─────────────────────────────────────
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var email = document.getElementById('email').value.trim();
    var pw    = document.getElementById('pw').value;
    if (!email || !pw) { showError('Please enter your email and password.'); return; }

    var btn = document.getElementById('btn');
    btn.disabled = true; btn.textContent = 'Signing in…';
    document.getElementById('err').classList.remove('on');

    fetch(apiBase + '/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: pw }),
    })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
    .then(function (result) {
      if (result.ok && result.data.token) {
        storeAndRedirect(result.data.token, result.data.role);
      } else {
        showError(result.data.error || 'Sign in failed. Please try again.');
      }
    })
    .catch(function () { showError('Network error — could not reach the server.'); });
  });
}());
</script>
</body>
</html>
